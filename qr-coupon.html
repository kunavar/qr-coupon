<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>QR skener</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: system-ui; padding: 16px; }
    #reader { width: 100%; max-width: 400px; margin: auto; }
    #result { margin-top: 16px; font-size: 18px; text-align: center; }
  </style>
</head>
<body>

<h2>QR skeniranje</h2>

<div id="reader"></div>
<div id="result"></div>

<script>
  const SUPABASE_URL = "https://hgqsqdwlqfkqkdiznalx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncXNxZHdscWZrcWtkaXpuYWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODMxMzAsImV4cCI6MjA5NDM1OTEzMH0.O3vCCDnN51IUR4P2zKhwg9-IFFGpVPfNuBLT8V-4K_Q";

  const resultEl = document.getElementById("result");

  const qr = new Html5Qrcode("reader");

  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    async (code) => {
      await qr.stop(); // zelo pomembno: prepreči večkratni scan

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/qr_codes`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Prefer": "return=minimal"
            },
            body: JSON.stringify({ code })
          }
        );

        if (response.ok) {
          resultEl.innerHTML = "✅ Koda uspešno zabeležena";
          resultEl.style.color = "green";
        } else {
          const err = await response.json();
          if (err.code === "23505") {
            resultEl.innerHTML = "❌ Žal, koda je že koriščena";
            resultEl.style.color = "red";
          } else {
            resultEl.innerHTML = "Napaka: " + JSON.stringify(err);
          }
        }

      } catch (e) {
        resultEl.innerHTML = "Napaka pri pošiljanju";
      }

      // po 2 sekundah ponovno aktiviramo kamero
      setTimeout(() => qr.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        arguments.callee
      ), 2000);
    }
  );
</script>

</body>
</html>

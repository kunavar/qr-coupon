<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">

  <!-- NO CACHE, EVER -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Loading…</title>

  <style>
    body {
      background:#fda75c;
      font-family: system-ui, -apple-system;
      margin:0;
      padding:24px;
    }

    .window {
      max-width:360px;
      margin:60px auto;
      background:#fde5c9;
      border:2px solid #111;
    }

    .titlebar {
      background:#f4763b;
      padding:6px;
      border-bottom:2px solid #111;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
      font-weight:600;
    }

    .buttons span {
      display:inline-block;
      width:12px;
      height:12px;
      border:1px solid #111;
      border-radius:50%;
      background:#fde5c9;
      margin-left:4px;
    }

    .content {
      padding:20px;
    }

    .progress {
      border:2px solid #111;
      height:18px;
      margin-top:12px;
      display:flex;
    }

    .bar {
      background:#cbb6f0;
      width:0%;
      transition:width 0.3s linear;
    }

    .icons {
      display:flex;
      gap:18px;
      margin-bottom:12px;
      font-size:24px;
    }
  </style>
</head>

<body>

<div class="window">
  <div class="titlebar">
    <div>System</div>
    <div class="buttons">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="content">
    <div class="icons">
      🌍 📄 📁
    </div>

    <div>Copying documents...</div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>
  </div>
</div>

<script>
  const bar = document.getElementById("bar");
  let progress = 0;

  const timer = setInterval(() => {
    progress += 20;
    bar.style.width = progress + "%";

    if (progress >= 100) {
      clearInterval(timer);
      location.replace("app.html?v=" + Date.now());
    }
  }, 120);
</script>

</body>
</html>

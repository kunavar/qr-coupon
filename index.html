<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>QR skeniranje</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f5f7fa;
      margin: 0;
      padding: 24px;
      color: #111827;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    #reader {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      display: none;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      margin: 24px auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #374151;
      margin-top: 16px;
    }

    .status-card {
      border-radius: 16px;
      padding: 32px 16px;
    }

    .success {
      background: #ecfdf3;
      color: #065f46;
    }

    .error {
      background: #fef2f2;
      color: #7f1d1d;
    }

    .icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .message {
      font-size: 18px;
      font-weight: 600;
    }

    .code {
      margin-top: 8px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular;
      color: #6b7280;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h1>QR skeniranje</h1>
<div class="subtitle">Usmeri kamero proti QR kodi</div>

<button id="startBtn" class="primary">Začni skeniranje</button>

<div class="controls">
  <input type="checkbox" id="autoContinue">
  <label for="autoContinue">Samodejno nadaljuj</label>
</div>

<div id="reader"></div>
<div id="result"></div>

<script>
  const SUPABASE_URL = "https://hgqsqdwlqfkqkdiznalx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncXNxZHdscWZrcWtkaXpuYWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODMxMzAsImV4cCI6MjA5NDM1OTEzMH0.O3vCCDnN51IUR4P2zKhwg9-IFFGpVPfNuBLT8V-4K_Q";

  const qr = new Html5Qrcode("reader");
  const readerDiv = document.getElementById("reader");
  const startBtn = document.getElementById("startBtn");
  const resultEl = document.getElementById("result");
  const autoContinueEl = document.getElementById("autoContinue");

  let locked = false;

  function showResult(type, text, code) {
    resultEl.innerHTML = `
      <div class="card status-card ${type}">
        <div class="icon">${type === "success" ? "✅" : "❌"}</div>
        <div class="message">${text}</div>
        <div class="code">${code}</div>
        ${autoContinueEl.checked ? "" : `
          <div style="margin-top:16px">
            <button class="secondary" onclick="restartScan()">
              Ponovno skeniraj
            </button>
          </div>
        `}
      </div>
    `;
  }

  async function restartScan() {
    resultEl.innerHTML = "";
    locked = false;
    await qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScan
    );
  }

  async function onScan(code) {
    if (locked) return;
    locked = true;

    await qr.stop();

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/qr_codes`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ code })
      });

      if (res.ok) {
        showResult("success", "Koda uspešno zabeležena", code);
      } else {
        let err = {};
        try { err = await res.json(); } catch {}
        if (err.code === "23505") {
          showResult("error", "Koda je že koriščena", code);
        } else {
          showResult("error", "Prišlo je do napake", code);
        }
      }

    } catch {
      showResult("error", "Napaka pri komunikaciji", code);
    }

    if (autoContinueEl.checked) {
      setTimeout(restartScan, 2000);
    }
  }

  startBtn.onclick = async () => {
    startBtn.style.display = "none";
    readerDiv.style.display = "block";
    await restartScan();
  };
</script>

</body>
</html>

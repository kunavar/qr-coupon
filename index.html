<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ABSOLUTNO BREZ CACHE -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Loading…</title>

  <style>
    body {
      background:#fda75c;
      font-family: system-ui, -apple-system;
      margin:0;
      padding:24px;
    }

    .window {
      max-width:360px;
      margin:80px auto;
      background:#fde5c9;
      border:2px solid #111;
    }

    .titlebar {
      background:#f4763b;
      padding:6px;
      border-bottom:2px solid #111;
      display:flex;
      justify-content:space-between;
      font-weight:600;
    }

    .buttons span {
      width:12px;height:12px;border:1px solid #111;
      border-radius:50%;display:inline-block;margin-left:4px;
      background:#fde5c9;
    }

    .content { padding:20px; }

    .progress {
      border:2px solid #111;
      height:18px;
      margin-top:12px;
      overflow:hidden;
    }

    .bar {
      background:#cbb6f0;
      height:100%;
      width:0%;
    }
  </style>
</head>

<body>

<div class="window">
  <div class="titlebar">
    <div>System</div>
    <div class="buttons"><span></span><span></span><span></span></div>
  </div>
  <div class="content">
    <div>Loading…</div>
    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>
  </div>
</div>

<script>
  const bar = document.getElementById("bar");
  let p = 0;

  const timer = setInterval(() => {
    p += 25;
    bar.style.width = p + "%";

    if (p >= 100) {
      clearInterval(timer);
      location.replace("app.html?v=" + Date.now());
    }
  }, 120);
</script>

</body>
</html>

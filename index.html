<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">

  <!-- FORCE NO CACHE (GitHub Pages + Safari) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>QR skeniranje</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- QR library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- build: 2026-05-15 -->

  <style>
    body {
      background: #fda75c;
      font-family: system-ui, -apple-system;
      padding: 24px;
      margin: 0;
    }

    .window {
      max-width: 360px;
      margin: 0 auto;
      background: #fde5c9;
      border: 2px solid #111;
      border-radius: 6px;
    }

    .titlebar {
      background: #f4763b;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #111;
    }

    .title {
      font-weight: 600;
      font-size: 14px;
    }

    .buttons span {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1px solid #111;
      margin-left: 4px;
      border-radius: 50%;
      background: #fde5c9;
    }

    .content {
      padding: 20px;
      text-align: center;
    }

    #reader {
      display: none;
      margin-top: 14px;
    }

    button {
      font-family: inherit;
      border: 2px solid #111;
      background: #ffd29a;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #ffbd6a;
    }

    .toggle {
      margin-top: 14px;
      font-size: 14px;
    }

    .status {
      margin-top: 14px;
      padding: 18px;
      border: 2px solid #111;
      background: #fff2e2;
    }

    .success {
      background: #eaffea;
    }

    .error {
      background: #ffeaea;
    }

    .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular;
      font-size: 13px;
      margin-top: 6px;
      color: #444;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="window">
  <div class="titlebar">
    <div class="title">QR skeniranje</div>
    <div class="buttons">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="content">

    <p>Usmeri kamero proti QR kodi</p>

    <button id="startBtn">Začni</button>

    <div class="toggle">
      <input type="checkbox" id="autoContinue">
      <label for="autoContinue">Samodejno nadaljuj</label>
    </div>

    <div id="reader"></div>
    <div id="result"></div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://hgqsqdwlqfkqkdiznalx.supabase.co";
  const SUPABASE_KEY = "TVOJ_ANON_KEY_TUKAJ";

  const qr = new Html5Qrcode("reader");
  const reader = document.getElementById("reader");
  const startBtn = document.getElementById("startBtn");
  const resultEl = document.getElementById("result");
  const autoEl = document.getElementById("autoContinue");

  let locked = false;

  function showResult(type, text, code) {
    resultEl.innerHTML = `
      <div class="status ${type}">
        <div class="icon">${type === "success" ? "😊" : "❗"}</div>
        <div>${text}</div>
        <div class="code">${code}</div>
        ${autoEl.checked ? "" : `
          <div style="margin-top:12px">
            <button onclick="restart()">Ponovno skeniraj</button>
          </div>
        `}
      </div>
    `;
  }

  async function restart() {
    resultEl.innerHTML = "";
    locked = false;
    await qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScan
    );
  }

  async function onScan(code) {
    if (locked) return;
    locked = true;

    await qr.stop();

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/qr_codes`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          Prefer: "return=minimal"
        },
        body: JSON.stringify({ code })
      });

      if (res.ok) {
        showResult("success", "Koda uspešno zabeležena", code);
      } else {
        let err = {};
        try { err = await res.json(); } catch {}
        if (err.code === "23505") {
          showResult("error", "Koda je že koriščena", code);
        } else {
          showResult("error", "Prišlo je do napake", code);
        }
      }

    } catch {
      showResult("error", "Napaka sistema", code);
    }

    if (autoEl.checked) {
      setTimeout(restart, 1800);
    }
  }

  startBtn.onclick = async () => {
    startBtn.style.display = "none";
    reader.style.display = "block";
    await restart();
  };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>QR skener</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: system-ui, -apple-system;
      background: #f8f9fb;
      margin: 0;
      padding: 24px;
      text-align: center;
      color: #111;
    }

    h2 { font-weight: 600; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }

    #reader {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      display: none;
    }

    .controls {
      margin: 16px 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #444;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      background: #111;
      color: #fff;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111;
    }

    #result { margin-top: 24px; display: none; }

    .status {
      padding: 32px 16px;
      border-radius: 20px;
      max-width: 360px;
      margin: 0 auto;
    }

    .success { background: #ecfdf5; color: #065f46; }
    .error { background: #fef2f2; color: #7f1d1d; }

    .icon { font-size: 48px; }
    .message { font-size: 18px; font-weight: 600; }
  </style>
</head>

<body>

<h2>QR skeniranje</h2>
<div class="subtitle">Usmeri kamero proti QR kodi</div>

<button id="startBtn">Začni skeniranje</button>

<div class="controls">
  <input type="checkbox" id="autoContinue" checked>
  <label for="autoContinue">Samodejno nadaljuj</label>
</div>

<div id="reader"></div>
<div id="result"></div>

<script>
  const SUPABASE_URL = "https://hgqsqdwlqfkqkdiznalx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncXNxZHdscWZrcWtkaXpuYWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODMxMzAsImV4cCI6MjA5NDM1OTEzMH0.O3vCCDnN51IUR4P2zKhwg9-IFFGpVPfNuBLT8V-4K_Q";

  const qr = new Html5Qrcode("reader");
  const startBtn = document.getElementById("startBtn");
  const readerDiv = document.getElementById("reader");
  const resultEl = document.getElementById("result");
  const autoContinueEl = document.getElementById("autoContinue");

  let locked = false;

  function showResult(type, text, code) {
    resultEl.style.display = "block";
    resultEl.innerHTML = `
      <div class="status ${type}">
        <div class="icon">${type === "success" ? "✅" : "❌"}</div>
        <div class="message">${text}</div>
        <div style="margin-top:8px; font-size:14px; color:#555;">
          ${code}
        </div>
        ${autoContinueEl.checked ? "" : `
          <button class="secondary" onclick="restartScan()" style="margin-top:16px;">
            Ponovno skeniraj
          </button>
        `}
      </div>
    `;
  }

  async function restartScan() {
    resultEl.style.display = "none";
    locked = false;
    await qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScan);
  }

  async function onScan(code) {
    if (locked) return;
    locked = true;

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/qr_codes`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ code })
      });

      await qr.stop();

      if (res.ok) showResult("success", "Koda uspešno zabeležena", code);
      else {
        const err = await res.json();
        if (err.code === "23505")
          showResult("error", "Koda je že koriščena", code);
        else
          showResult("error", "Prišlo je do napake", code);
      }

    } catch {
      showResult("error", "Napaka pri komunikaciji", code);
    }

    if (autoContinueEl.checked)
      setTimeout(restartScan, 2000);
  }

  startBtn.onclick = async () => {
    startBtn.style.display = "none";
    readerDiv.style.display = "block";
    await qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScan);
  };
</script>

</body>
</html>
